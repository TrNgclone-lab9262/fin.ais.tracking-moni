    <script>
      try {
        var raw = localStorage.getItem("HOME_MONI_DATA_V4");
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.settings && parsed.settings.themeMode === "dark") {
            document.documentElement.classList.add("dark");
          }
        }
      } catch (e) {}
    </script>
