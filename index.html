<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HOME MONI - Quản Lý Tài Chính Gia Đình</title>
    <meta name="description" content="Nền tảng quản lý tài chính tổ ấm thông minh, bảo mật cho 2 vợ chồng (Anh Chuột & Bé Mèo)." />
    <meta property="og:title" content="HOME MONI - Quản Lý Tài Chính Gia Đình" />
    <meta property="og:description" content="Nền tảng quản lý tài chính tổ ấm thông minh, bảo mật cho 2 vợ chồng (Anh Chuột & Bé Mèo)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HOME MONI" />
    <meta name="application-name" content="HOME MONI" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        var isDarkMode = false;
        var isLockedOnOpen = window.location.pathname === "/login";
        var raw = localStorage.getItem("HOME_MONI_DATA_V4");
        if (raw) {
          var parsed = JSON.parse(raw);
          var s = parsed && parsed.settings;
          if (s) {
            if (s.themeMode === "dark") {
              isDarkMode = true;
              document.documentElement.classList.add("dark");
            }
            if (
              s.requireAuthOnOpen ||
              Boolean(s.pinCode) ||
              Boolean(s.husbandAuth && s.husbandAuth.passcodeHash) ||
              Boolean(s.wifeAuth && s.wifeAuth.passcodeHash)
            ) {
              isLockedOnOpen = true;
            }
          }
        }
        if (metaTheme) {
          metaTheme.setAttribute("content", isDarkMode || isLockedOnOpen ? "#0f172a" : "#ffffff");
        }
      } catch (e) {}
    </script>
    <script>
      (function () {
        try {
          var host = window.location.hostname || "";
          var isDevOrigin =
            host === "localhost" ||
            host === "127.0.0.1" ||
            host.indexOf("ais-dev-") === 0;
          var CURRENT_CACHE = "homemoni-pwa-v1.9.1";
          var EVICT_FLAG = "HOME_MONI_SW_EVICTED_191";

          if (isDevOrigin) {
            var hadController = Boolean(
              "serviceWorker" in navigator && navigator.serviceWorker.controller
            );
            var cleanupTasks = [];

            if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
              cleanupTasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister().catch(function () {});
                    })
                  );
                })
              );
            }

            if ("caches" in window && caches.keys) {
              cleanupTasks.push(
                caches.keys().then(function (keys) {
                  var targets = keys.filter(function (k) {
                    return k.indexOf("homemoni-pwa-") === 0;
                  });
                  return Promise.all(
                    targets.map(function (k) {
                      return caches.delete(k).catch(function () {});
                    })
                  ).then(function () {
                    return targets.length > 0;
                  });
                })
              );
            }

            Promise.all(cleanupTasks)
              .then(function (results) {
                var clearedLegacyCache = Boolean(results[results.length - 1]);
                if (
                  (hadController || clearedLegacyCache) &&
                  !sessionStorage.getItem(EVICT_FLAG)
                ) {
                  sessionStorage.setItem(EVICT_FLAG, "1");
                  window.location.reload();
                }
              })
              .catch(function () {});
          } else if ("caches" in window && caches.keys) {
            caches
              .keys()
              .then(function (keys) {
                var stale = keys.filter(function (k) {
                  return k.indexOf("homemoni-pwa-") === 0 && k !== CURRENT_CACHE;
                });
                if (stale.length === 0) return;
                return Promise.all(
                  stale.map(function (k) {
                    return caches.delete(k).catch(function () {});
                  })
                ).then(function () {
                  if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                      regs.forEach(function (reg) {
                        reg.update().catch(function () {});
                      });
                    });
                  }
                });
              })
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
